# Event Congestion Scenario
# =========================
# Large outdoor event in Southwark causes crowd congestion.

scenario:
  name: event_congestion
  description: >
    A large outdoor event in central Southwark draws big crowds.
    A sudden incident triggers panic.
  scenario_text: >
    You are attending a large outdoor event in Southwark. The area
    is very crowded. An incident has occurred — there may be danger.
  goal: Leave the event area safely. Avoid stampede and congestion.

simulation:
  steps: 300
  seed: 256
  dt: 0.1
  awareness_radius: 1.5
  use_llm: true
  interval_ms: 250

world:
  data_path: reference_data/southwark_reference_data_table.parquet.gzip
  num_exits: 6

agents:
  groups:
    - count: 15
      name: attendee
      description: >
        You are attending the event and are in the thick of the
        crowd. You tend to follow others around you.
      goal: Leave the event area as safely and quickly as possible.

    - count: 8
      name: bystander
      description: >
        You are a bystander nearby who got caught up in the crowd.
        You want to get away from the congestion.
      goal: Move away from the crowd and find a clear path out.

    - count: 3
      name: steward
      description: >
        You are an event steward. You stay calm under pressure and
        try to guide people to safety. You move deliberately.
      goal: Help direct people toward exits. Stay calm and guide others.

pheromones:
  - name: visited
    decay_rate: 0.02
    diffusion_rate: 0.05
    max_value: 50.0
  - name: congestion
    decay_rate: 0.1
    diffusion_rate: 0.15
    max_value: 50.0
  - name: danger
    decay_rate: 0.08
    diffusion_rate: 0.2
    max_value: 100.0

hazards:
  - type: gas
    origin: { x: 12, y: 18 }
    start_tick: 50
    intensity: 0.6
    spread_rate: 0.04
    spread_radius: 10
    duration: 150

events: []
