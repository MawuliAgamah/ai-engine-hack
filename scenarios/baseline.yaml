# Baseline Scenario — Business as Usual
# ======================================
# No hazards, no events.  Agents simply navigate the environment.

scenario:
  name: baseline
  description: >
    Normal conditions — no emergencies.  Agents go about their business
    in Southwark, London.
  scenario_text: >
    The area is operating normally. Navigate the area as you would on a normal day.
  goal: >
    Navigate the environment. Explore the area and find interesting places.

simulation:
  steps: 120
  seed: 42
  dt: 0.1
  awareness_radius: 1.0
  use_llm: true
  interval_ms: 250

world:
  data_path: reference_data/southwark_reference_data_table.parquet.gzip
  num_exits: 10

agents:
  groups:
    - count: 8
      name: commuter
      description: >
        You are a hurried commuter, trying to get to work on time.
        Avoid crowds and move quickly.
      goal: Reach your workplace as quickly as possible. It is north of your current position.

    - count: 6
      name: tourist
      description: >
        You are a tourist exploring the area. You are curious so stop
        and look around often. Follow the crowds.
      goal: Explore the area and take in the sights.

    - count: 4
      name: elderly
      description: >
        You are elderly and move carefully. You prefer familiar paths
        and tend to move in a deliberate direction.
      goal: Navigate to the south exit while avoiding crowded areas.

    - count: 2
      name: child
      description: >
        You are a child with a parent. You follow nearby people and
        get distracted easily.
      goal: Follow your parent and stay close to them.

pheromones:
  - name: visited
    decay_rate: 0.02
    diffusion_rate: 0.05
    max_value: 50.0
  - name: congestion
    decay_rate: 0.1
    diffusion_rate: 0.1
    max_value: 50.0

hazards: []
events: []
