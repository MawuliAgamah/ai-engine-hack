# Traffic Flow Analysis Scenario
# ==============================
# Normal pedestrian traffic flow through Southwark.

scenario:
  name: traffic_flow
  description: >
    Normal pedestrian traffic flow through Southwark. Commuters,
    tourists, and locals navigate the area with different goals.
  scenario_text: >
    A busy day in Southwark. People are going about their normal
    business — commuting, shopping, sightseeing.
  goal: Navigate to your destination efficiently.

simulation:
  steps: 200
  seed: 77
  dt: 0.1
  awareness_radius: 1.0
  use_llm: true
  interval_ms: 250

world:
  data_path: reference_data/southwark_reference_data_table.parquet.gzip
  num_exits: 12

agents:
  groups:
    - count: 10
      name: commuter_eastbound
      description: >
        You are a morning commuter heading east. You walk briskly
        and prefer direct routes. You get impatient in crowds.
      goal: Head east across the area as quickly as possible.

    - count: 6
      name: commuter_southbound
      description: >
        You are a commuter heading south. You know the area and
        take efficient routes.
      goal: Move south through the area to your workplace.

    - count: 4
      name: tourist
      description: >
        You are a tourist meandering through Southwark. You walk
        slowly and look around at the architecture and shops.
      goal: Explore the area. Wander and enjoy the neighbourhood.

pheromones:
  - name: visited
    decay_rate: 0.02
    diffusion_rate: 0.05
    max_value: 50.0
  - name: congestion
    decay_rate: 0.1
    diffusion_rate: 0.1
    max_value: 50.0

hazards: []
events: []
